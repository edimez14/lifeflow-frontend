[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeflow-frontend"
version = "0.1.0"
description = "Lifeflow frontend built with Flet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flet>=0.25.0",
  "httpx>=0.27.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "state*", "screens*", "components*"]
exclude = ["assets*"]
